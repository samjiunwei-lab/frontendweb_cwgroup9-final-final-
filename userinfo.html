<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | UTAR E-Sports Club</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Global Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Sci-fi glassmorphism style consistent with tournaments, login, and signup pages --- */
        body {
            background-color: #0b0c10;
            background-image: radial-gradient(circle at top right, rgba(0, 240, 255, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(201, 138, 68, 0.05), transparent 40%);
            background-attachment: fixed;
        }

        /* Reusable glass panel styling */
        .glass-panel {
            background: rgba(20, 23, 34, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Profile information grid tiles */
        .info-tile {
            background: rgba(30, 36, 52, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px 18px;
            height: 100%;
        }
        .info-tile .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b92a5;
            margin-bottom: 6px;
        }
        .info-tile .info-value {
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.35;
        }

        /* Custom profile avatar styling */
        .profile-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(201,138,68,0.15));
            border: 2px solid rgba(0,240,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: var(--neon-cyan, #00f0ff);
            flex-shrink: 0;
            overflow: hidden;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Navigation back link */
        .back-link {
            color: #a0a5b5;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: #fff; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 18px;
        }

        /* Joined Tournaments List Styles */
        .joined-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(30, 36, 52, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }
        .joined-row:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
            color: inherit;
        }
        .joined-row .joined-title {
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }
        .joined-row .joined-meta {
            color: #8b92a5;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .joined-row .joined-status {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 50rem;
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-cyan, #00f0ff);
            white-space: nowrap;
        }

        /* Fallback UI when no tournaments are joined */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <!-- Animated network background container (Vanta.js) -->
    <div id="vanta-bg"></div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-cyber fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">UTAR <span>E-SPORTS</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="teams.html">Our Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                </ul>
                
                <div class="d-flex gap-2 ms-auto mt-2 mt-lg-0">
                    <a href="login.html" class="btn btn-cyber btn-sm" id="nav-login-btn">
                        <i class="fa-solid fa-user me-1"></i> Login
                    </a>
                    <a href="#" id="nav-logout-btn" class="btn btn-danger btn-sm" style="display:none;">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container pt-1 mt-1 mb-1">

        <a href="tournaments.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>

        <div class="row g-4">
            <!-- Left Column: User Profile Information -->
            <div class="col-lg-5">
                <div class="glass-panel">
                    
                    <!-- User Avatar Section -->
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="profile-avatar">
                            <!-- Default user avatar image with fallback to FontAwesome icon if missing -->
                            <img src="images/useravatar.webp" alt="Profile avatar"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <i class="fa-solid fa-user" style="display:none;"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold text-white mb-0" id="profileUsername">—</h4>
                            <div style="color:#a0a5b5; font-size:0.85rem;">UTAR E-Sports Member</div>
                        </div>
                    </div>

                    <!-- User Details Grid -->
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="info-tile">
                                <div class="info-label">Name</div>
                                <div class="info-value" id="profileName">—</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-tile">
                                <div class="info-label">Surname</div>
                                <div class="info-value" id="profileSurname">—</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-tile">
                                <div class="info-label">Date of Birth</div>
                                <div class="info-value" id="profileBirthday">—</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-tile">
                                <div class="info-label">Country</div>
                                <div class="info-value" id="profileCountry">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Joined Tournaments -->
            <div class="col-lg-7">
                <div class="glass-panel">
                    <div class="section-title">My Tournaments</div>
                    
                    <!-- Dynamic container for generating joined tournaments -->
                    <div id="joinedList"></div>
                    
                    <!-- Empty State: Displayed when no tournaments are joined -->
                    <div class="empty-state" id="emptyState" style="display:none;">
                        <i class="fa-solid fa-gamepad fs-1 mb-3" style="color:#a0a5b5;"></i>
                        <h6 class="text-white">No tournaments joined yet</h6>
                        <p class="mb-3" style="color:#a0a5b5; font-size:0.9rem;">Head over to the tournaments page and join one to see it here.</p>
                        <a href="tournaments.html" class="btn btn-cyber btn-sm">Browse Tournaments</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JS Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    
    <!-- Required to convert saved tournament IDs into actual tournament details (title, date, status) -->
    <script src="js/tournaments-data.js"></script>

    <script>
        const JOINED_STORAGE_KEY = 'utarEsportsJoinedTournaments';
        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                              "July", "August", "September", "October", "November", "December"];
        const COUNTRY_NAMES = { MY: "Malaysia", SG: "Singapore" };

        // Helper function to extract the active username from cookies
        function getCurrentUsername() {
            if (!document.cookie.includes('gamerName=')) return null;
            return decodeURIComponent(document.cookie.split('gamerName=')[1].split(';')[0]);
        }

        // Helper function to retrieve tournament IDs the user has joined from local storage
        function getJoinedIds(username) {
            try {
                const map = JSON.parse(localStorage.getItem(JOINED_STORAGE_KEY)) || {};
                return map[username] || [];
            } catch (e) {
                return [];
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const username = getCurrentUsername();

            // Redirect unauthorized users to the login page, 
            // remembering the current page to return them here after a successful login.
            if (!username) {
                sessionStorage.setItem('returnAfterLogin', window.location.pathname + window.location.search);
                window.location.href = 'login.html';
                return;
            }

            // --- Render User Profile (fetching data stored in localStorage during registration) ---
            const account = (typeof getAccount === 'function') ? getAccount(username) : null;

            document.getElementById('profileUsername').textContent = username;

            if (account) {
                document.getElementById('profileName').textContent = account.name || '—';
                document.getElementById('profileSurname').textContent = account.surname || '—';

                // Format the birth date nicely if all segments are available
                if (account.birthDay && account.birthMonth && account.birthYear) {
                    const monthName = MONTH_NAMES[parseInt(account.birthMonth, 10) - 1] || account.birthMonth;
                    document.getElementById('profileBirthday').textContent =
                        account.birthDay + ' ' + monthName + ' ' + account.birthYear;
                } else {
                    document.getElementById('profileBirthday').textContent = '—';
                }

                document.getElementById('profileCountry').textContent =
                    COUNTRY_NAMES[account.country] || account.country || '—';
            }

            // --- Render Joined Tournaments ---
            const joinedIds = getJoinedIds(username);
            const listEl = document.getElementById('joinedList');
            const emptyEl = document.getElementById('emptyState');

            // Map IDs to their details, filter out invalid/removed tournaments to prevent rendering errors, and sort by date
            const validEntries = joinedIds
                .map(id => ({ id: id, data: tournamentsData[id] }))
                .filter(entry => !!entry.data) 
                .sort((a, b) => new Date(a.data.date) - new Date(b.data.date));

            if (validEntries.length === 0) {
                emptyEl.style.display = 'block';
            } else {
                emptyEl.style.display = 'none';
                validEntries.forEach(entry => {
                    const t = entry.data;
                    const row = document.createElement('a');
                    row.href = 'tournament-details.html?id=' + encodeURIComponent(entry.id);
                    row.className = 'joined-row';
                    
                    // Construct the HTML for the tournament row
                    row.innerHTML =
                        '<div>' +
                            '<div class="joined-title">' + t.title + '</div>' +
                            '<div class="joined-meta">' + t.gameLabel + ' · ' + t.date + '</div>' +
                        '</div>' +
                        '<span class="joined-status"><i class="fa-solid fa-circle-check me-1"></i>Joined</span>';
                    listEl.appendChild(row);
                });
            }
        });
    </script>

    <!-- Animated network background scripts (Vanta.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        // Initialize Vanta background effect
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: false,
            touchControls: false,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x004d44,
            backgroundColor: 0x0b0c10
        });
    </script>

</body>
</html>
